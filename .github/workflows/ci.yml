name: CI

on:
  push:
    branches:
      - "personal/**"
      - "custom/**"
  pull_request:
    branches:
      - "personal/**"
      - "custom/**"
  workflow_dispatch:
    inputs:
      build_variant:
        description: "手动运行任务"
        required: true
        default: "noR8"
        type: choice
        options:
          - noR8
          - debug
          - check

jobs:
  compile:
    name: Compile Kotlin
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_variant == 'check'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile app debug Kotlin
        run: ./gradlew :app:compileAppDebugKotlin

      - name: Test read aloud visual positioning
        run: ./gradlew :app:testAppDebugUnitTest --tests "io.legado.app.ui.book.read.page.ReadAloudVisualPositionerTest"

  build-apk:
    name: Build ${{ inputs.build_variant }} APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_variant != 'check'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected APK
        run: |
          case "${{ inputs.build_variant }}" in
            debug)
              ./gradlew :app:assembleAppDebug
              ;;
            noR8)
              ./gradlew :app:assembleAppNoR8
              ;;
            *)
              echo "Unknown build_variant: ${{ inputs.build_variant }}"
              exit 1
              ;;
          esac

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-${{ inputs.build_variant }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
