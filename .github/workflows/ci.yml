name: CI

on:
  push:
    branches:
      - "personal/**"
      - "custom/**"
  pull_request:
    branches:
      - "personal/**"
      - "custom/**"
  workflow_dispatch:

jobs:
  compile:
    name: Compile Kotlin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile app debug Kotlin
        run: ./gradlew :app:compileAppDebugKotlin

      - name: Test read aloud visual positioning
        run: ./gradlew :app:testAppDebugUnitTest --tests "io.legado.app.ui.book.read.page.ReadAloudVisualPositionerTest"
