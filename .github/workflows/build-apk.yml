name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build
        required: true
        default: arm64-v8a-noR8
        type: choice
        options:
          - arm64-v8a-noR8

jobs:
  build:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Remove Aliyun mirrors
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build selected APK
        run: ./gradlew --no-configuration-cache -Plegado.splitAbis=arm64-v8a :app:assembleAppNoR8

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-${{ inputs.variant }}-unsigned-apk
          path: app/build/outputs/apk/**/noR8/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
