name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - noR8

jobs:
  build:
    name: Build ${{ inputs.variant }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Remove Aliyun mirrors
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build selected APK
        run: |
          if [ "${{ inputs.variant }}" = "debug" ]; then
            ./gradlew --no-configuration-cache :app:assembleAppDebug
          else
            ./gradlew --no-configuration-cache :app:assembleAppNoR8
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-${{ inputs.variant }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
